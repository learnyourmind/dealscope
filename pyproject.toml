[project]
name = "dealscope"
version = "0.1.0"
description = "First-pass US residential rental-property analysis"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under is a ratchet: set just below the measured baseline (97% after Phase 1-2 work); raise it as tests land (spec §5.5 targets 80%).
addopts = "-ra --strict-markers --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "venv/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
