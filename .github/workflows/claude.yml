name: Claude Code (@claude)

# Inert until BOTH are set by the repository owner:
#   1. repository variable CLAUDE_ACTION_ENABLED = true
#   2. repository secret ANTHROPIC_API_KEY (or switch to claude_code_oauth_token)
# and the Claude GitHub App is installed (run /install-github-app in Claude Code, or see
# https://code.claude.com/docs/en/github-actions). Only users with write access can trigger it.
# It follows CLAUDE.md. Review every change it pushes: branch protection still requires CI.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: ${{ vars.CLAUDE_ACTION_ENABLED == 'true' && contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 12"
