name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Secret scan
        run: python scripts/scan_secrets.py --all
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Tests (with coverage gate)
        run: python -m pytest
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  docker:
    name: Docker build and container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t dealscope:ci --build-arg APP_VERSION=${GITHUB_SHA::7} .
      - name: Run container and smoke test
        run: |
          docker run -d --name dealscope -p 8000:8000 dealscope:ci
          bash scripts/smoke.sh http://127.0.0.1:8000
      - name: Container logs on failure
        if: failure()
        run: docker logs dealscope
