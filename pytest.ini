[pytest]
testpaths = tests
# --cov-fail-under is a ratchet: set just below the measured baseline (97% after Phase 1-2 work);
# raise it as tests land (spec §5.5 targets 80%). Never lower it to get a change through.
addopts = -ra --strict-markers --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=90
