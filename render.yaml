# Render Blueprint (spec OPS-03, §6.4). Create via Dashboard → New → Blueprint → select this repo.
# Deploys only after the GitHub checks (CI) on the commit pass.
services:
  - type: web
    name: dealscope
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PROPERTY_PROVIDER
        # Keep the provider off until Phase 0 provider-terms approval is recorded (spec §7).
        value: disabled
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: INFO
